name: Bug report
description: Something doesn't work or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! **Never paste cookies, tokens or your `arl` value.** Security issues are reported privately: see SECURITY.md.
  - type: dropdown
    id: target
    attributes:
      label: Where
      options:
        - Windows app
        - Extension (Chrome, Edge, Brave, Opera)
        - Userscript
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: Better Deezer (Settings › About, or `better-deezer version`), Deezer, browser or Windows.
      placeholder: Better Deezer 1.2.0, Deezer 8.0.10, Windows 11
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you do, what you see, what you expected. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Missing elements
      description: What Settings › About shows, or the output of `__betterDeezer.health()` in the console (F12).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Log (Windows app)
      description: The output of `better-deezer logs`.
      render: text
