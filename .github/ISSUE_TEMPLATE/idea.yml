name: Feature request
description: A feature, a module or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What you would like to do, and why.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What it could look like. A mockup or a screenshot from another app helps.
