name: Release

# Push a tag like v0.3.0 (matching package.json "version") to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: |
          npm run build
          node --check dist/extension/better-deezer.js
          node --check dist/better-deezer.user.js

      - name: Package
        run: |
          mkdir -p release
          (cd dist/extension && zip -r -X ../../release/better-deezer-extension.zip .)
          cp dist/better-deezer.user.js release/
          cp desktop/install.ps1 desktop/setup.ps1 desktop/patch.ps1 desktop/uninstall.ps1 desktop/cli.ps1 desktop/ui.ps1 release/
          mkdir -p windows && cp desktop/*.ps1 dist/better-deezer.user.js windows/
          (cd windows && zip -r -X ../release/better-deezer-windows.zip .)
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Better Deezer ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
          body: |
            ### Windows (Deezer desktop app)
            In PowerShell: `irm https://github.com/Gabizoc/Better-Deezer/releases/latest/download/install.ps1 | iex`
            Or unzip `better-deezer-windows.zip` and run `install.ps1`.

            ### Browser
            Unzip `better-deezer-extension.zip`, then load the folder as an unpacked extension
            (chrome://extensions, Developer mode, "Load unpacked").

            ### Userscript
            Open `better-deezer.user.js` with Violentmonkey or Tampermonkey.
